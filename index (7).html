<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دندان‌کوئست | ترم ۱ تا ۳ دندانپزشکی</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Tahoma, "Vazirmatn", sans-serif;
    background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
    color: #fff; min-height: 100vh; padding: 20px;
    display: flex; justify-content: center; align-items: flex-start;
  }
  .wrap { width: 100%; max-width: 900px; }
  header { text-align: center; margin-bottom: 16px; }
  header h1 { font-size: 1.7em; }
  header p { opacity: .7; font-size: .9em; margin-top: 4px; }
  nav { display: flex; gap: 8px; margin-bottom: 16px; }
  nav button {
    flex: 1; padding: 12px; border: none; border-radius: 12px; cursor: pointer;
    background: rgba(255,255,255,.1); color: #fff; font-family: inherit; font-size: .95em;
  }
  nav button.active { background: linear-gradient(90deg,var(--acc1),var(--acc2)); color: #042; font-weight: bold; }
  .panel { background: rgba(255,255,255,.08); border-radius: 18px; padding: 24px; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  h2 { margin-bottom: 10px; }
  h3 { font-size: 1em; margin: 16px 0 8px; color: var(--head); }

  :root { --bg1:#0f2027; --bg2:#203a43; --bg3:#2c5364; --acc1:#4facfe; --acc2:#00f2a0; --head:#9fd6ff; }
  .theme-box { display:none; margin-top:12px; background: rgba(255,255,255,.08); border-radius:14px; padding:14px; }
  .theme-box.open { display:block; }
  .theme-grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap:10px; }
  .theme-grid label { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:.9em; }
  .theme-grid input[type=color] { width:56px; height:34px; border:none; background:none; cursor:pointer; }
  .presets { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .muted { opacity: .7; font-size: .9em; line-height: 1.7; }
  .btn {
    padding: 12px 16px; border: none; border-radius: 10px; cursor: pointer; font-family: inherit;
    background: linear-gradient(90deg,var(--acc1),var(--acc2)); color: #042; font-weight: bold; font-size: .98em;
  }
  .btn.sec { background: rgba(255,255,255,.15); color: #fff; font-weight: normal; }
  .btn.warn { background: #e0475b; color: #fff; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
  .grow { flex: 1; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    padding: 8px 14px; border-radius: 20px; border: 2px solid rgba(255,255,255,.2); cursor: pointer;
    background: transparent; color: #fff; font-family: inherit; font-size: .92em;
  }
  .chip.on { background: #4facfe55; border-color: #4facfe; }
  input[type=number] {
    width: 90px; padding: 8px; border-radius: 10px; border: none; font-family: inherit; font-size: 1em; text-align: center;
  }
  .card-opt { background: rgba(255,255,255,.06); border-radius: 12px; padding: 14px; margin-top: 12px; }
  .estimate { margin-top: 16px; padding: 12px; border-radius: 12px; background: rgba(0,0,0,.25); line-height: 1.9; }
  .warnbox { color: #ffd166; }
  .tag { display: inline-block; background: #4facfe33; color: var(--head); padding: 3px 10px; border-radius: 10px; font-size: .8em; margin-bottom: 10px; }
  .q { font-size: 1.1em; line-height: 1.9; margin-bottom: 14px; }
  .opts { display: grid; gap: 10px; }
  .opt {
    background: rgba(255,255,255,.1); border: 2px solid transparent; color: #fff; padding: 12px;
    border-radius: 12px; cursor: pointer; text-align: right; font-family: inherit; font-size: 1em;
  }
  .opt.sel { border-color: #4facfe; background: rgba(79,172,254,.25); }
  .opt.correct { background: #1faa5966; border-color: #1faa59; }
  .opt.wrong { background: #e0475b66; border-color: #e0475b; }
  textarea {
    width: 100%; min-height: 200px; padding: 12px; border-radius: 12px; border: none;
    font-family: inherit; font-size: 1em; line-height: 1.8; resize: vertical; direction: rtl;
  }
  .exam-layout { display: grid; grid-template-columns: 170px 1fr; gap: 16px; }
  @media (max-width: 700px) { .exam-layout { grid-template-columns: 1fr; } }
  .sidebar { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
  .num {
    width: 38px; height: 38px; border-radius: 10px; border: none; cursor: pointer; font-family: inherit;
    background: rgba(255,255,255,.12); color: #fff;
  }
  .num.done { background: #1faa5966; }
  .num.cur { outline: 2px solid #ffd166; }
  .clock { font-size: 1.3em; font-weight: bold; color: #ffd166; direction: ltr; }
  .clock.low { color: #e0475b; }
  .bar { height: 8px; background: rgba(255,255,255,.15); border-radius: 8px; overflow: hidden; margin: 10px 0; }
  .bar div { height: 100%; background: linear-gradient(90deg,var(--acc1),var(--acc2)); }
  .box { margin-top: 12px; padding: 14px; border-radius: 12px; background: rgba(0,0,0,.25); line-height: 1.8; font-size: .95em; }
  .kw { display: inline-block; padding: 2px 8px; margin: 2px; border-radius: 8px; font-size: .85em; }
  .kw.hit { background: #1faa5966; }
  .kw.miss { background: #e0475b44; }
  .big { font-size: 2.8em; text-align: center; margin: 10px 0; }
  .note-sec { margin-bottom: 18px; }
  .note-sec ul { padding-right: 20px; line-height: 2; }
  .note-sec li b { color: #ffd166; }
  .term-h { font-size: 1.15em; color: #00f2a0; margin: 22px 0 4px; border-bottom: 1px solid rgba(255,255,255,.15); padding-bottom: 4px; }
  .review { background: rgba(255,255,255,.06); padding: 12px; border-radius: 10px; margin-bottom: 10px; }
  .termlabel { font-size: .85em; opacity: .8; margin: 10px 0 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🦷 دندان‌کوئست</h1>
    <p>جزوه و ساخت آزمون دلخواه (تستی / تشریحی / ترکیبی) برای ترم ۱ تا ۳ دندانپزشکی</p>
      <div class="row" style="justify-content:center"><button class="btn sec" onclick="toggleTheme()">🎨 تغییر رنگ‌ها</button></div>
    <div class="theme-box" id="themeBox">
      <div class="theme-grid">
        <label>پس‌زمینه (شروع)<input type="color" id="c_bg1" value="#0f2027" oninput="setColor('bg1',this.value)"></label>
        <label>پس‌زمینه (میانه)<input type="color" id="c_bg2" value="#203a43" oninput="setColor('bg2',this.value)"></label>
        <label>پس‌زمینه (پایان)<input type="color" id="c_bg3" value="#2c5364" oninput="setColor('bg3',this.value)"></label>
        <label>رنگ دکمه‌ها (۱)<input type="color" id="c_acc1" value="#4facfe" oninput="setColor('acc1',this.value)"></label>
        <label>رنگ دکمه‌ها (۲)<input type="color" id="c_acc2" value="#00f2a0" oninput="setColor('acc2',this.value)"></label>
        <label>رنگ عنوان‌ها<input type="color" id="c_head" value="#9fd6ff" oninput="setColor('head',this.value)"></label>
      </div>
      <div class="presets">
        <button class="btn sec" onclick="applyPreset('default')">پیش‌فرض</button>
        <button class="btn sec" onclick="applyPreset('ocean')">اقیانوس</button>
        <button class="btn sec" onclick="applyPreset('sunset')">غروب</button>
        <button class="btn sec" onclick="applyPreset('forest')">جنگل</button>
        <button class="btn sec" onclick="applyPreset('night')">شب</button>
      </div>
    </div>
  </header>
  <nav>
    <button id="tab-notes" onclick="show('notes')">📚 جزوه</button>
    <button id="tab-build" onclick="show('build')">🛠 ساخت آزمون</button>
  </nav>
  <div class="panel" id="app"></div>
</div>

<script>
// ================= ساختار دروس =================
// توجه: تقسیم‌بندی دروس بر اساس تجربه کلی است؛ با سرفصل واحد خودتان تطبیق دهید.
const TERMS = {
  1: { name: "ترم ۱", topics: ["آناتومی سر و گردن", "بیوشیمی و فیزیولوژی پایه", "جنین‌شناسی عمومی"] },
  2: { name: "ترم ۲", topics: ["آناتومی دندان", "هیستولوژی دندان", "تکامل دندان"] },
  3: { name: "ترم ۳", topics: ["مواد دندانی", "فیزیولوژی و پالپ"] }
};
const CATS = Object.values(TERMS).flatMap(t => t.topics);
const TERM_OF = {};
for (const k in TERMS) TERMS[k].topics.forEach(c => TERM_OF[c] = k);

// ================= جزوه =================
const NOTES = {
  // ---- ترم ۱ ----

    "<b>مندیبل</b> تنها استخوان متحرک جمجمه است؛ اجزا: کندیل، راموس، زاویه، بدنه، کرونوئید، کانال دندانی تحتانی (حاوی عصب و شریان آلوئولار تحتانی) و فورامن منتال.",
    "<b>مفصل گیجگاهی‌فکی (TMJ)</b>: کندیل مندیبل + فوسا گلنوئید تمپورال + دیسک مفصلی؛ حرکات باز و بسته و لغزش جلو. اختلال آن: درد، صدای کلیک، محدودیت باز شدن دهان.",
    "<b>عضلات جونده</b>: ماستر، تمپورال، پتریگوئید داخلی و خارجی؛ همگی توسط عصب فک پایین (V3) عصب‌دهی می‌شوند. پتریگوئید خارجی مسئول حرکت جلو و لغزش کندیل است.",
    "<b>عضلات زبانی</b>: ژنیوگلوس، هیوگلوس، استیلوگلوس، پالاتوگلوس (عصب‌دهی زبان: XII به جز پالاتوگلوس که توسط X است).",
    "<b>عصب سه‌قلو (V)</b>: حس صورت و دندان‌ها؛ V1 (چشمی)، V2 (فکی بالا: دندان‌های بالا از طریق شاخه‌های آلوئولار فوقانی)، V3 (فکی پایین: دندان‌های پایین از طریق عصب آلوئولار تحتانی و مثبت زبان و عصب باکال).",
    "<b>بی‌حسی موضعی دندان پایین</b>: بلوک عصب آلوئولار تحتانی (IANB) در فورامن مندیبل؛ زبان و لب پایین نیز بی‌حس می‌شوند.",
    "<b>عصب فاسیال (VII)</b>: حرکات mimic صورت و حس چشایی دو سوم قدامی زبان (کورددا تمپانی). فلج آن منجر به افتادگی یک‌طرفه صورت می‌شود.",

    "<b>فضاهای عمقی گردن</b>: فضای زیر زبان، فضای ماستر، فضای پتریگوئید، فضای پاروتید. عفونت دندان‌ها می‌تواند به این فضاها گسترش یابد و خطرناک باشد.",

  ],
  "بیوشیمی و فیزیولوژی پایه": [

    model: "برگشت‌پذیر: درد گذرا با تحریک (سرما، شیرین)، بدون درد خودبه‌خودی، درمان: برداشتن عامل تحریک و پرکردن. برگشت‌ناپذیر: درد خودبه‌خودی و ماندگار، پاسخ طولانی به سرما، درد شبانه، درمان: درمان ریشه.",
    kw: ["گذرا","خودبه‌خود","سرما","درمان ریشه","ماندگار","پالپ","تحریک"] }
];

// ================= وضعیت =================
const S = {
  tab: "notes",
  notesTopic: "all",
  type: "mixed",
  nMcq: 8,
  nEssay: 2,
  minutes: 20,
  topics: new Set(CATS),
  exam: null
};

function $(id) { return document.getElementById(id); }
function shuffle(a) { const b = [...a]; for (let i = b.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function fmt(s) { const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), x = s%60; const p = n => String(n).padStart(2,"0"); return h>0 ? `${h}:${p(m)}:${p(x)}` : `${p(m)}:${p(x)}`; }
function filterBy(arr) { return arr.filter(q => S.topics.has(q.cat)); }
function countFor(cat) { return MCQ.filter(q=>q.cat===cat).length + ESSAY.filter(q=>q.cat===cat).length; }

function show(tab) {
  if (S.exam && !S.exam.done && tab !== S.tab) {
    if (!confirm("آزمون در حال اجراست. با خروج، آزمون بدون نتیجه‌گیری بسته می‌شود. ادامه می‌دهید؟")) return;
    clearInterval(S.exam.timer); S.exam = null;
  }
  S.tab = tab;
  $("tab-notes").classList.toggle("active", tab==="notes");
  $("tab-build").classList.toggle("active", tab==="build");
  if (tab === "notes") renderNotes();
  else renderBuilder();
}

// ================= جزوه =================
function renderNotes() {
  const sel = S.notesTopic;
  let groups;
  if (sel === "all") groups = Object.keys(TERMS);
  else if (TERMS[sel]) groups = [sel];
  else groups = [TERM_OF[sel]];
  const topicsOf = k => (sel === "all" || TERMS[sel]) ? TERMS[k].topics : [sel];

  $("app").innerHTML = `
    <h2>📚 جزوه ترم ۱ تا ۳ دندانپزشکی</h2>
    <div class="chips" style="margin:10px 0 6px">
      <button class="chip ${sel==='all'?'on':''}" onclick="S.notesTopic='all';renderNotes()">همه</button>
      ${Object.keys(TERMS).map(k=>`<button class="chip ${sel===k?'on':''}" onclick="S.notesTopic='${k}';renderNotes()">${TERMS[k].name}</button>`).join("")}
    </div>
    <div class="chips" style="margin:6px 0 16px">
      ${CATS.map(c=>`<button class="chip ${sel===c?'on':''}" onclick="S.notesTopic='${c}';renderNotes()">${c}</button>`).join("")}
    </div>
    ${groups.map(k=>`
      <div class="term-h">${TERMS[k].name}</div>
      ${topicsOf(k).map(t=>`<div class="note-sec"><h3>${t}</h3><ul>${NOTES[t].map(i=>`<li>${i}</li>`).join("")}</ul></div>`).join("")}
    `).join("")}`;
}

// ================= ساخت آزمون =================
function renderBuilder() {
  const avM = filterBy(MCQ).length, avE = filterBy(ESSAY).length;
  const useM = S.type !== "essay", useE = S.type !== "mcq";
  const suggested = (useM ? Math.min(S.nMcq, avM) * 1 : 0) + (useE ? Math.min(S.nEssay, avE) * 8 : 0);
  const quick = [10, 15, 20, 30, 45, 60, 90];

  $("app").innerHTML = `
    <h2>🛠 ساخت آزمون</h2>
    <div class="card-opt">
      <h3 style="margin-top:0">۱. نوع آزمون</h3>
      <div class="chips">
        ${[["mcq","📝 تستی"],["essay","✍️ تشریحی"],["mixed","🔀 ترکیبی"]].map(([k,l])=>
          `<button class="chip ${S.type===k?'on':''}" onclick="setType('${k}')">${l}</button>`).join("")}
      </div>
      <div class="row">
        ${useM ? `<label>تعداد تستی: <input type="number" min="1" max="${avM}" value="${Math.min(S.nMcq,avM)}" onchange="S.nMcq=Math.max(1,Math.min(${avM},+this.value||1));renderBuilder()"></label>` : ""}
        ${useE ? `<label>تعداد تشریحی: <input type="number" min="1" max="${avE}" value="${Math.min(S.nEssay,avE)}" onchange="S.nEssay=Math.max(1,Math.min(${avE},+this.value||1));renderBuilder()"></label>` : ""}
      </div>
      <p class="muted" style="margin-top:8px">موجود در بانک با مباحث انتخابی: ${useM ? avM+" تستی" : ""} ${useE ? "· "+avE+" تشریحی" : ""}</p>
    </div>

    <div class="card-opt">
      <h3 style="margin-top:0">۲. مدت زمان آزمون (دقیقه)</h3>
      <div class="chips">
        ${quick.map(m=>`<button class="chip ${S.minutes===m?'on':''}" onclick="S.minutes=${m};renderBuilder()">${m}</button>`).join("")}
      </div>
      <div class="row">
        <label>یا مدت دلخواه: <input type="number" min="1" max="300" value="${S.minutes}" onchange="S.minutes=Math.max(1,+this.value||1);renderBuilder()"></label>
      </div>
      <div class="estimate">
        زمان پیشنهادی برای این آزمون: <b>${suggested}</b> دقیقه
        (هر تستی ≈ ۱ دقیقه، هر تشریحی ≈ ۸ دقیقه)
        ${S.minutes < suggested ? `<div class="warnbox">⚠️ زمان انتخابی کمتر از پیشنهادی است.</div>` : ""}
      </div>
    </div>

    <div class="card-opt">
      <h3 style="margin-top:0">۳. مباحث (از ترم ۱ تا ۳)</h3>
      ${Object.keys(TERMS).map(k=>`
        <div class="termlabel">${TERMS[k].name}</div>
        <div class="chips">
          ${TERMS[k].topics.map(c=>`<button class="chip ${S.topics.has(c)?'on':''}" onclick="toggleTopic('${c}')">${c} (${countFor(c)})</button>`).join("")}
        </div>`).join("")}
      <div class="row">
        <button class="btn sec" onclick="S.topics=new Set(CATS);renderBuilder()">انتخاب همه</button>
        <button class="btn sec" onclick="S.topics=new Set();renderBuilder()">پاک کردن</button>
      </div>
    </div>

    <div class="row">
      <button class="btn grow" ${(S.topics.size===0 || avM+avE===0) ? "disabled" : ""} onclick="startExam()">▶ شروع آزمون</button>
    </div>`;
}

function setType(t) {
  S.type = t;
  if (t === "mcq") { S.nMcq = 10; }
  if (t === "essay") { S.nEssay = 3; }
  if (t === "mixed") { S.nMcq = 8; S.nEssay = 2; }
  renderBuilder();
}
function toggleTopic(c) {
  S.topics.has(c) ? S.topics.delete(c) : S.topics.add(c);
  renderBuilder();
}

// ================= اجرای آزمون =================
function startExam() {
  const useM = S.type !== "essay", useE = S.type !== "mcq";
  const mcqs = useM ? shuffle(filterBy(MCQ)).slice(0, S.nMcq) : [];
  const essays = useE ? shuffle(filterBy(ESSAY)).slice(0, S.nEssay) : [];
  const items = [...mcqs.map(d => ({kind:"m", d})), ...essays.map(d => ({kind:"e", d}))];
  S.exam = {
    items, idx: 0,
    ans: items.map(() => null),
    secLeft: S.minutes * 60,
    done: false, timer: null, startedAt: Date.now()
  };
  S.exam.timer = setInterval(tick, 1000);
  renderExam();
}

function tick() {
  const ex = S.exam;
  if (!ex || ex.done) return;
  ex.secLeft--;
  const c = $("clock");
  if (c) { c.textContent = fmt(ex.secLeft); c.classList.toggle("low", ex.secLeft <= 60); }
  if (ex.secLeft <= 0) { alert("زمان آزمون تمام شد."); submitExam(); }
}

function renderExam() {
  const ex = S.exam;
  const it = ex.items[ex.idx];
  const answered = ex.ans.filter(a => a !== null && a !== "").length;
  const isLast = ex.idx === ex.items.length - 1;

  const body = it.kind === "m" ? `
      <span class="tag">${TERMS[TERM_OF[it.d.cat]].name} · ${it.d.cat} · تستی</span>
      <div class="q">${ex.idx+1}. ${it.d.q}</div>
      <div class="opts">
        ${it.d.o.map((t,k)=>`<button class="opt ${ex.ans[ex.idx]===k?'sel':''}" onclick="pickMcq(${k})">${t}</button>`).join("")}
      </div>`
    : `
      <span class="tag">${TERMS[TERM_OF[it.d.cat]].name} · ${it.d.cat} · تشریحی</span>
      <div class="q">${ex.idx+1}. ${it.d.q}</div>
      <textarea placeholder="پاسخ خود را بنویسید..." oninput="S.exam.ans[S.exam.idx]=this.value;updateProgress()">${ex.ans[ex.idx] || ""}</textarea>`;

  $("app").innerHTML = `
    <div class="row" style="justify-content:space-between;margin-top:0">
      <span>سؤال ${ex.idx+1} از ${ex.items.length}</span>
      <span class="clock ${ex.secLeft<=60?'low':''}" id="clock">${fmt(ex.secLeft)}</span>
    </div>
    <div class="bar"><div id="prog" style="width:${answered/ex.items.length*100}%"></div></div>
    <div class="exam-layout">
      <div>
        <div class="sidebar">
          ${ex.items.map((_,i)=>`<button class="num ${i===ex.idx?'cur':''} ${ex.ans[i]!==null && ex.ans[i]!==''?'done':''}" onclick="goTo(${i})">${i+1}</button>`).join("")}
        </div>
      </div>
      <div>
        ${body}
        <div class="row">
          <button class="btn sec" ${ex.idx===0?'disabled':''} onclick="goTo(${ex.idx-1})">→ قبلی</button>
          ${isLast ? "" : `<button class="btn" onclick="goTo(${ex.idx+1})">بعدی ←</button>`}
          <button class="btn warn grow" onclick="confirmSubmit()">پایان و تصحیح</button>
        </div>
      </div>
    </div>`;
}

function updateProgress() {
  const ex = S.exam;
  const answered = ex.ans.filter(a => a !== null && a !== "").length;
  const p = $("prog"); if (p) p.style.width = (answered/ex.items.length*100) + "%";
  document.querySelectorAll(".num").forEach((b,i)=>b.classList.toggle("done", ex.ans[i]!==null && ex.ans[i]!==""));
}

function pickMcq(k) { S.exam.ans[S.exam.idx] = k; renderExam(); }
function goTo(i) { S.exam.idx = i; renderExam(); }
function confirmSubmit() {
  const ex = S.exam;
  const left = ex.ans.filter(a => a === null || a === "").length;
  const msg = left ? `${left} سؤال بی‌پاسخ مانده. آزمون تمام شود؟` : "آزمون تمام شود؟";
  if (confirm(msg)) submitExam();
}

// ================= تصحیح =================
function submitExam() {
  const ex = S.exam;
  if (ex.done) return;
  ex.done = true;
  clearInterval(ex.timer);
  const usedSec = Math.round((Date.now() - ex.startedAt)/1000);

  let mTotal = 0, mCorrect = 0, eTotal = 0, eSum = 0;
  const reviews = ex.items.map((it, i) => {
    const a = ex.ans[i];
    if (it.kind === "m") {
      mTotal++;
      const ok = a === it.d.a;
      if (ok) mCorrect++;
      return `<div class="review">
        <div><b>${i+1}.</b> ${it.d.q}</div>
        <div class="muted" style="margin-top:6px">پاسخ شما: ${a===null?'بی‌پاسخ':it.d.o[a]} ${ok?'✅':'❌'}</div>
        ${ok?'':`<div class="muted">پاسخ درست: ${it.d.o[it.d.a]}</div>`}
        <div class="muted">💡 ${it.d.e}</div></div>`;
    } else {
      eTotal++;
      const text = a || "";
      const hits = it.d.kw.filter(k => text.includes(k));
      const pct = Math.round(hits.length / it.d.kw.length * 100);
      eSum += pct;
      return `<div class="review">
        <div><b>${i+1}.</b> ${it.d.q}</div>
        <div class="muted" style="margin-top:6px">کلیدواژه‌های پوشش‌داده‌شده: ${hits.length} از ${it.d.kw.length} (${pct}٪)</div>
        <div style="margin-top:6px">${it.d.kw.map(k=>`<span class="kw ${hits.includes(k)?'hit':'miss'}">${k}</span>`).join("")}</div>
        <div class="box"><b>پاسخ نمونه:</b><br>${it.d.model}</div>
        ${text ? "" : `<div class="muted">پاسخی ثبت نشده بود.</div>`}</div>`;
    }
  });

  const mPct = mTotal ? Math.round(mCorrect/mTotal*100) : null;
  const ePct = eTotal ? Math.round(eSum/eTotal) : null;
  const parts = [mPct, ePct].filter(x => x !== null);
  const overall = Math.round(parts.reduce((a,b)=>a+b,0) / parts.length);
  const msg = overall>=80 ? "عالی! 🎓" : overall>=50 ? "خوبه، مرور بیشتر کن 📚" : "نیاز به مطالعه بیشتر دارید 💪";

  $("app").innerHTML = `
    <h2>نتیجه آزمون</h2>
    <div class="big">${overall}٪</div>
    <p style="text-align:center">${msg}</p>
    <div class="row" style="justify-content:center;gap:24px">
      ${mPct!==null ? `<span>تستی: <b>${mCorrect} از ${mTotal}</b> (${mPct}٪)</span>` : ""}
      ${ePct!==null ? `<span>تشریحی (کلیدواژه): <b>${ePct}٪</b></span>` : ""}
      <span>زمان مصرفی: <b>${fmt(usedSec)}</b></span>
    </div>
    <h3>تصحیح و بازبینی</h3>
    ${reviews.join("")}
    <div class="row"><button class="btn" onclick="show('build')">ساخت آزمون جدید</button></div>`;
}

show("notes");
</script>

<script>
const THEME_DEF = {bg1:'#0f2027',bg2:'#203a43',bg3:'#2c5364',acc1:'#4facfe',acc2:'#00f2a0',head:'#9fd6ff'};
const PRESETS = {
  default: {bg1:'#0f2027',bg2:'#203a43',bg3:'#2c5364',acc1:'#4facfe',acc2:'#00f2a0',head:'#9fd6ff'},
  ocean:  {bg1:'#0b3d91',bg2:'#1565c0',bg3:'#0097a7',acc1:'#00e5ff',acc2:'#80ffea',head:'#b3e5fc'},
  sunset: {bg1:'#3e1f47',bg2:'#8e2de2',bg3:'#f76b1c',acc1:'#ffb347',acc2:'#ff5e62',head:'#ffe0b2'},
  forest: {bg1:'#0b2e13',bg2:'#1b5e20',bg3:'#33691e',acc1:'#a5d6a7',acc2:'#c5e1a5',head:'#dcedc8'},
  night:  {bg1:'#000000',bg2:'#1a1a2e',bg3:'#16213e',acc1:'#e94560',acc2:'#f5b041',head:'#f1948a'}
};
function applyTheme(t){
  const r=document.documentElement.style;
  for(const k in t){ r.setProperty('--'+k,t[k]); const el=document.getElementById('c_'+k); if(el) el.value=t[k]; }
}
function getTheme(){ try{ return Object.assign({},THEME_DEF,JSON.parse(localStorage.getItem('dq_theme')||'{}')); }catch(e){ return Object.assign({},THEME_DEF); } }
function setColor(k,v){ const t=getTheme(); t[k]=v; applyTheme(t); localStorage.setItem('dq_theme',JSON.stringify(t)); }
function applyPreset(n){ const t=Object.assign({},PRESETS[n]); applyTheme(t); localStorage.setItem('dq_theme',JSON.stringify(t)); }
function toggleTheme(){ document.getElementById('themeBox').classList.toggle('open'); }
applyTheme(getTheme());
</script>
</body>
